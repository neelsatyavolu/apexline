<!-- @startingPoint section="PitWall App" subtitle="Full macOS F1 companion app shell" viewport="1360x900" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="darkreader-lock">
<title>PitWall</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--bg-app); }
  #root { height: 100vh; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: var(--ink-600); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-500); background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../node_modules/react/umd/react.development.js"></script>
<script src="../../node_modules/react-dom/umd/react-dom.development.js"></script>
<script src="../../node_modules/@babel/standalone/babel.min.js"></script>
<script src="../../node_modules/hls.js/dist/hls.min.js"></script>
<script src="../../node_modules/shaka-player/dist/shaka-player.compiled.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script src="sync.js"></script>
<script type="text/babel" src="DataProvider.jsx" data-presets="react"></script>
<script type="text/babel" src="AppShell.jsx" data-presets="react"></script>
<script type="text/babel" src="Dashboard.jsx" data-presets="react"></script>
<script type="text/babel" src="Weekend.jsx" data-presets="react"></script>
<script type="text/babel" src="LiveRacing.jsx" data-presets="react"></script>
<script type="text/babel" src="Leaderboards.jsx" data-presets="react"></script>
<script type="text/babel" src="Schedule.jsx" data-presets="react"></script>
<script type="text/babel" src="News.jsx" data-presets="react"></script>
<script type="text/babel" src="Analytics.jsx" data-presets="react"></script>
<script type="text/babel" src="Copilot.jsx" data-presets="react"></script>
<script type="text/babel" src="Settings.jsx" data-presets="react"></script>
<script type="text/babel" data-presets="react">
  const { AppShell } = window.PW;
  const TITLES = {
    dashboard: { t: "Dashboard", c: "Live F1 overview" },
    weekend: { t: "Weekend", c: "Race weekend" },
    leaderboards: { t: "Leaderboards", c: "2026 Championship" },
    schedule: { t: "Schedule", c: "2026 Season" },
    news: { t: "News", c: "Live feed" },
    analytics: { t: "Analytics", c: "Deep dives" },
    copilot: { t: "AI Copilot", c: "Race intelligence" },
    settings: { t: "Settings", c: "" },
  };
  function initialPitWallScreen() {
    const allowed = new Set(["dashboard", "weekend", "live", "leaderboards", "schedule", "news", "analytics", "copilot", "settings"]);
    const params = new URLSearchParams(window.location.search);
    const fromQuery = params.get("screen");
    const fromHash = window.location.hash.replace(/^#\/?/, "");
    const candidate = String(fromQuery || fromHash || "dashboard").toLowerCase();
    return allowed.has(candidate) ? candidate : "dashboard";
  }
  function App() {
    const [screen, setScreen] = React.useState(initialPitWallScreen);
    function handleSearchResult(result) {
      if (result && result.driverCode) localStorage.setItem("pw-search-focus", result.driverCode);
      if (result && result.screen) setScreen(result.screen);
    }
    if (screen === "live") {
      const Live = window.PW.LiveRacing;
      return <Live onExit={() => setScreen("dashboard")} />;
    }
    const Screen = {
      dashboard: window.PW.Dashboard,
      weekend: window.PW.Weekend,
      leaderboards: window.PW.Leaderboards,
      schedule: window.PW.Schedule,
      news: window.PW.News,
      analytics: window.PW.Analytics,
      copilot: window.PW.Copilot,
      settings: window.PW.Settings,
    }[screen];
    const meta = TITLES[screen] || { t: "", c: "" };
    return (
      <AppShell
        active={screen}
        onNavigate={setScreen}
        title={meta.t}
        crumb={meta.c}
        onGoLive={() => setScreen("live")}
        onSearchResult={handleSearchResult}
      >
        {Screen ? <Screen onNavigate={setScreen} onGoLive={() => setScreen("live")} /> : null}
      </AppShell>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<window.PW.DataProvider><App /></window.PW.DataProvider>);
</script>
</body>
</html>
